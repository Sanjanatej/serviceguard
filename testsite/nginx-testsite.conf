server {
    listen 8080;
    server_name localhost;
    root /var/www/testsite;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        default_type text/plain;
        try_files /health =404;
    }

    access_log /var/log/nginx/testsite_access.log;
    error_log  /var/log/nginx/testsite_error.log;
}
